[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sha256-heat-kernel"
version = "0.1.0"
description = "Spectral geometry analysis of SHA-256 using heat kernel methods"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Bee Davis", email = "bee_davis@alumni.brown.edu"}
]
keywords = ["cryptography", "spectral-geometry", "heat-kernel", "sha256"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Security :: Cryptography",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.0",
    "mypy>=1.0",
]
viz = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]
gpu = [
    "cupy-cuda12x>=12.0",
    "numba>=0.57",
]
modal = [
    "modal>=0.50",
]
all = [
    "sha256-heat-kernel[dev,viz,gpu,modal]",
]

[project.scripts]
sha256-hk = "main:main"

[project.urls]
Homepage = "https://github.com/nurdymuny/sha-256-heat-kernel-cryptanalysis"
Documentation = "https://github.com/nurdymuny/sha-256-heat-kernel-cryptanalysis#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
